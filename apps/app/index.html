<!doctype html>
<html lang="en" class="bb-app-shell-root">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" id="theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="bb" />
    <title>bb</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
      id="favicon-32"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
      id="favicon-16"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
      id="apple-touch-icon"
    />
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      id="app-manifest"
      crossorigin="use-credentials"
    />
    <script data-bb-pre-paint>
      (function () {
        var dev = "%MODE%" === "development";
        function setFavicon(dark) {
          var s = dev ? "-dev" : dark ? "-dark" : "";
          document.getElementById("favicon-32").href =
            "/favicon-32x32" + s + ".png";
          document.getElementById("favicon-16").href =
            "/favicon-16x16" + s + ".png";
        }
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        setFavicon(mq.matches);
        if (!dev)
          mq.addEventListener("change", function (e) {
            setFavicon(e.matches);
          });
        var darkTheme = mq.matches;
        document.getElementById("theme-color").content = darkTheme
          ? "#151515"
          : "#ffffff";
        if (darkTheme) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body class="bb-app-shell">
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
